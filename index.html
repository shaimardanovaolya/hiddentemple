<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сканер дрона</title>
  <link rel="stylesheet" href="style.css?v=shrine-2">
</head>
<body>
  <main class="arena" aria-label="Сканер дрона">
    <div id="game" aria-hidden="true"></div>
    <header class="hud">
      <div class="brand"><small>Ворота Тории</small><strong>Сканер дрона</strong></div>
      <div class="meters" aria-label="Энергия сканера">
        <div><strong id="charge">00</strong><span id="charge-limit"></span><small>Заряды</small></div>
        <div><strong id="shots">00</strong><span id="shot-limit"></span><small>Попытки</small></div>
      </div>
      <div class="tools">
        <button id="reset" type="button" title="Начать заново" aria-label="Начать заново">↻</button>
        <button id="settings" type="button" title="Настройки" aria-label="Настройки">⚙</button>
      </div>
    </header>
    <section id="screen" class="screen" aria-label="Игровая сцена"></section>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-header"><h2 id="modal-title"></h2><button id="close" type="button" aria-label="Закрыть" autofocus>×</button></div>
      <div id="modal-body"></div>
    </dialog>
    <p id="error" role="alert" hidden>Игра не запустилась. Обновите страницу в браузере.</p>
    <noscript>Для игры включите JavaScript в браузере.</noscript>
  </main>
  <script>
    window.showGameError = () => { document.getElementById('error').hidden = false; };
    window.addEventListener('error', window.showGameError);
    window.addEventListener('unhandledrejection', window.showGameError);
  </script>
  <script src="lib/phaser.min.js" onerror="showGameError()"></script>
  <script src="game.js?v=shrine-13-fix" onerror="showGameError()"></script>
</body>
</html>
